          el('div', { class: 'perfil-bio', html: '<b>Castro Construções</b><br>A loja que conhece a sua obra.<br>Pisos, tintas, banheiro, ferramentas e mais.<br>Av. Central Norte, 131 · Trindade-PE' }))),
      el('div', { class: 'destaques' }, GRUPOS.map(([g, nome]) => el('div', { class: 'destaque' }, el('i', {}, nome.slice(0, 1)), nome.split(/ e | /)[0]))),
      el('div', { class: 'feed-aviso' }, 'As artes são publicadas de baixo para cima. Role até o final para ver a primeira.'),
      grade,
      el('div', { class: 'feed-fim' }, el('b', {}, 'Fim do feed.'), ' A última arte da grade (#1) é a primeira a ser publicada.')));
  }

  const CORES = [['Azul Castro', '#005FAC'], ['Azul claro', '#3395D4'], ['Azul marinho', '#001830'], ['Azul profundo', '#000F20'], ['Vermelho telhado', '#E63A30'], ['Prata aço', '#C5C6CB']];
  function vMarca() {
    const cor = (n, h) => el('div', { class: 'cor' }, el('i', { style: `background:${h}` }), el('div', {}, el('b', {}, n), h));
    const logo = (f, fundo) => el('div', { style: `background:${fundo}` }, el('img', { src: 'marca/' + f, alt: f }));
    view.append(
      el('h2', { class: 'sec' }, 'Cores da marca'), el('div', { class: 'cores' }, CORES.map(([n, h]) => cor(n, h))),
      el('p', { class: 'nota' }, 'O vermelho é só acento (no máximo 10% da arte). Estas cores e os 3 temas deste painel (azul, claro e escuro) vêm do projeto Site.'),
      el('h2', { class: 'sec', style: 'margin-top:24px' }, 'Fontes'),
      el('div', { class: 'tipos' },
        el('div', { class: 'card' }, el('b', {}, 'Nas artes: Fira Sans'), el('div', { class: 'amostra', style: "font-family:'Fira Sans';font-weight:700" }, 'Cement Grigio 88×88'),
          el('div', { style: "font-family:'Fira Sans'" }, 'no cartão ou 10% à vista no Pix'), el('p', { class: 'nota' }, 'Regular e Bold. Grátis no Canva: a arte fica igual no repositório, no PowerPoint e no Canva.')),
        el('div', { class: 'card' }, el('b', {}, 'Neste painel e no site: Bale + Inter'), el('div', { class: 'amostra', style: 'font-family:var(--font-title)' }, 'A loja que conhece a sua obra'),
          el('div', {}, 'Textos em Inter, títulos em Bale Bold.'), el('p', { class: 'nota' }, 'As mesmas fontes do projeto Site.'))),
      el('h2', { class: 'sec', style: 'margin-top:24px' }, 'Logo e "C" da marca'),
      el('div', { class: 'logos' }, logo('logos/azul.png', '#F4F6F9'), logo('logos/branca.png', '#00203F'), logo('logos/preta.png', '#F4F6F9'), logo('logos/vermelha.png', '#FFFFFF'),
        logo('elementos/c-castro-vermelho.png', '#FFFFFF'), logo('elementos/c-castro-branco.png', '#005FAC')),
      el('p', { class: 'nota' }, 'Logo e "C" são imagens originais: nunca refazer, esticar ou recolorir.'));
  }

  // ───────── Detalhe ─────────
  const atual = () => E.lista[E.atual];
  const PPTX_TIPO = 'application/vnd.openxmlformats-officedocument.presentationml.presentation';
  const nomeArq = (m) => slug(m.id + '-' + m.nome);
  function abrir(lista, i) {
    if (i < 0 || i >= lista.length) return;
    E.lista = lista; E.atual = i; const m = lista[i];
    if ($('#detalhe').hidden) history.pushState({ det: 1 }, '');
    $('#detalhe').hidden = false; document.body.style.overflow = 'hidden'; $('.caixa').scrollTop = 0;
    $('#infoCod').textContent = `${m.id} · ${nomeGrupo(m.grupo)}`;
    $('#infoNome').textContent = m.nome; $('#infoObj').textContent = m.objetivo || ''; $('#infoProd').textContent = m.produto || '';
    $('#infoLegenda').value = m.legenda || ''; msg('');
    const im = $('#dImg'); im.src = mini(m.id); im.alt = `${m.id} ${m.nome}`;
    const grande = new Image(); grande.onload = () => { if (atual() === m) im.src = grande.src; }; grande.src = cheia(m.id);
    $('#btAnt').disabled = i === 0; $('#btProx').disabled = i === lista.length - 1;
  }
  function fechar() { $('#detalhe').hidden = true; document.body.style.overflow = ''; E.atual = -1; }
  $('#btFechar').onclick = () => { if (history.state && history.state.det) history.back(); else fechar(); };
  $('#btAnt').onclick = () => abrir(E.lista, E.atual - 1);
  $('#btProx').onclick = () => abrir(E.lista, E.atual + 1);
  window.addEventListener('popstate', () => { if (!$('#detalhe').hidden) fechar(); });

  const baixarLink = (url, nome) => { const a = el('a', { href: url, download: nome }); document.body.append(a); a.click(); a.remove(); };
  const baixarBlob = (blob, nome) => { const u = URL.createObjectURL(blob); baixarLink(u, nome); setTimeout(() => URL.revokeObjectURL(u), 10000); };

  // ABRIR NO CANVA. O Chrome do Android NÃO deixa compartilhar .pptx pelo menu Compartilhar (só imagem, vídeo, áudio, texto e PDF): dá "NotAllowedError".
  // Por isso: baixa o .pptx (vai para Downloads) e abre o APP do Canva; lá, Criar/+ > Enviar (upload) > escolher o arquivo.
  const abrirAppCanva = () => {
    if (/android/i.test(navigator.userAgent)) location.href = 'intent://www.canva.com/#Intent;scheme=https;package=com.canva.editor;S.browser_fallback_url=' + encodeURIComponent('market://details?id=com.canva.editor') + ';end'; // sem o app: abre a página dele na Play Store (mostra Instalar/Abrir)
    else window.open('https://www.canva.com/', '_blank', 'noopener');
  };
  const instrucao = (m) => `Arquivo "${nomeArq(m)}.pptx" baixado (pasta Downloads). Agora toque em "2º passo: abrir o app do Canva". No Canva: toque em + (Criar) > Enviar arquivo (Upload) > escolha esse arquivo.`;
  $('#btCanva').onclick = () => {
    const m = atual(); if (!m) return;
    baixarLink(pptxUrl(m.id), nomeArq(m) + '.pptx'); msg(instrucao(m));
    $('#btCanva2').scrollIntoView({ block: 'center', behavior: 'smooth' }); $('#btCanva2').classList.add('prim-pulso');
  };
  $('#btCanva2').onclick = () => { const m = atual(); if (m) msg(instrucao(m)); abrirAppCanva(); };

  async function buscar(url) { const r = await fetch(url); if (!r.ok) throw new Error('arquivo não encontrado'); return r.blob(); }
  async function comoPNG(jpg) {
    const bmp = await createImageBitmap(jpg), cv = document.createElement('canvas'); cv.width = bmp.width; cv.height = bmp.height;
    cv.getContext('2d').drawImage(bmp, 0, 0); bmp.close(); return new Promise((ok) => cv.toBlob(ok, 'image/png'));
  }
  async function comoPDF(jpg) {
    const bytes = new Uint8Array(await jpg.arrayBuffer()), W = 1080, H = 1440, PW = W * .75, PH = H * .75, enc = new TextEncoder(), partes = [], off = []; let pos = 0;
    const add = (x) => { const b = typeof x === 'string' ? enc.encode(x) : x; partes.push(b); pos += b.length; };
    const obj = (n, c) => { off[n] = pos; add(`${n} 0 obj\n${c}\nendobj\n`); };
    add('%PDF-1.4\n'); obj(1, '<< /Type /Catalog /Pages 2 0 R >>'); obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
    off[4] = pos; add(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${W} /Height ${H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`); add(bytes); add('\nendstream\nendobj\n');
    const c = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`; obj(5, `<< /Length ${c.length} >>\nstream\n${c}\nendstream`);
    const xr = pos; add('xref\n0 6\n0000000000 65535 f \n'); for (let n = 1; n <= 5; n++) add(String(off[n]).padStart(10, '0') + ' 00000 n \n');
    add(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`); return new Blob(partes, { type: 'application/pdf' });
  }
  document.querySelectorAll('[data-fmt]').forEach((b) => b.addEventListener('click', async () => {
    const m = atual(); if (!m) return; const f = b.dataset.fmt, nome = nomeArq(m); msg('Gerando…'); b.disabled = true;
    try {
      if (f === 'pptx') baixarLink(pptxUrl(m.id), nome + '.pptx');
      else if (f === 'jpg') baixarLink(cheia(m.id), nome + '.jpg');
      else if (f === 'png') baixarBlob(await comoPNG(await buscar(cheia(m.id))), nome + '.png');
      else if (f === 'pdf') baixarBlob(await comoPDF(await buscar(cheia(m.id))), nome + '.pdf');
      else {
        const arq = new File([await buscar(cheia(m.id))], nome + '.jpg', { type: 'image/jpeg' });
        if (navigator.canShare && navigator.canShare({ files: [arq] })) await navigator.share({ files: [arq], title: m.nome });
        else baixarBlob(arq, arq.name);
      }
      msg(f === 'compartilhar' ? '' : f.toUpperCase() + ' baixado (pasta Downloads).');
    } catch (e) { msg(e && e.name === 'AbortError' ? '' : 'Não deu certo: ' + (e && e.message)); }
    b.disabled = false;
  }));
  $('#btLegenda').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('#infoLegenda').value); aviso('Legenda copiada.', 'ok', 2500); }
    catch (e) { const t = $('#infoLegenda'); t.focus(); t.select(); aviso('Legenda selecionada: toque em Copiar no menu do teclado.', '', 4000); }
  });
  if (!location.hash) history.replaceState(null, '', '#/geral');
  desenhar();
})();
</script>
